name: CI & Data Validation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Quality & Integrity Validation
        run: |
          python src/validate_data.py

      - name: Run Data Cleaning & Feature Pipeline
        run: |
          python src/clean_data.py

      - name: Run Chart Generation Suite
        run: |
          python src/generate_charts.py

      - name: Run Executive Analysis Summary
        run: |
          python analysis.py
